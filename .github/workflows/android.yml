name: Android build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build a standalone on-device AI APK or a private Tailscale-hosted APK
        required: true
        default: on_device_ai
        type: choice
        options:
          - on_device_ai
          - tailscale
      https_app_url:
        description: Required only for tailscale mode; root HTTPS Tailscale *.ts.net origin
        required: false
        type: string
      publish_release:
        description: Publish the CI-verified installable debug APK as a GitHub prerelease (main branch only; not production-signed)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and tests
        run: pnpm check && pnpm test
      - name: Build API and frontend
        run: pnpm build

  android:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LUMO_ANDROID_BUILD_MODE: ${{ inputs.build_mode }}
      VITE_LUMO_ANDROID_BUILD_MODE: ${{ inputs.build_mode }}
      LUMO_CAPACITOR_SERVER_URL: ${{ inputs.build_mode == 'tailscale' && inputs.https_app_url || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Verify Android SDK environment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path was not exported by setup-android}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          sdkmanager --list >/dev/null
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Android build mode
        run: node scripts/validate-android-origin.mjs
      - name: Validate private Tailscale origin
        if: inputs.build_mode == 'tailscale'
        run: node scripts/verify-android-origin.mjs
      - name: Build and sync Android project
        run: pnpm run android:build
      - name: Verify the packaged app origin
        run: node scripts/verify-android-origin.mjs
      - name: Verify installable debug APK and package id
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.devhub201.lumo'"
          echo "Debug APK size: $(stat -c%s "$APK") bytes"
      - name: Verify portrait and landscape support in APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml \
            | tee /tmp/lumo-manifest.xmltree \
            | grep -Eq 'android:screenOrientation.*=(0x0*4|4|sensor)([[:space:]]|$)'
      - name: Verify APK contains the supplied LUMO frontend
        run: python3 scripts/verify-android-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verified debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumo-${{ inputs.build_mode }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: lumo-${{ inputs.build_mode }}-debug-apk
          path: release-files
      - name: Publish GitHub debug-APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=release-files/app-debug.apk
          test -s "$APK"
          TAG="lumo-android-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LUMO Android debug APK ${GITHUB_RUN_NUMBER}" \
            --notes "CI-verified installable debug APK for the deployed HTTPS LUMO app. This is not a production-signed build. Built from ${GITHUB_SHA}." \
            --prerelease
