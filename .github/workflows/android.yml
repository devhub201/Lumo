name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android defaults to the removed legacy `tools` package.
          # Keep license acceptance inside the maintained action so CI never
          # opens an interactive sdkmanager prompt or pipes guessed answers.
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Verify Android SDK environment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path was not exported by setup-android}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          sdkmanager --list >/dev/null
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and tests
        run: pnpm check && pnpm test
      - name: Build web assets and sync Capacitor
        run: pnpm build && pnpm exec cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk) bytes"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
