name: Regen lockfile (temp)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Push regenerated lockfile to a dedicated branch
        run: |
          git config user.name "lumo-ci-bot"
          git config user.email "ci@lumo.local"
          git checkout -B lockfile-output
          git add pnpm-lock.yaml
          git commit -m "ci: regenerated pnpm-lock.yaml" --allow-empty
          git push --force origin lockfile-output
